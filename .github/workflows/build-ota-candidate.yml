name: Firmware checks and OTA candidate

on:
  push:
    branches: [main, 'candidate/**']
    paths: ['PlatformIO/**', 'Arduino/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['PlatformIO/**', 'Arduino/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32c3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Firmware regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser regression tests
        run: |
          npm ci --ignore-scripts --prefix tests
          npm test --prefix tests
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Compile ESP32-C3
        run: pio run -d PlatformIO -e esp32c3
      - name: Printer profile persistence tests
        run: python tests/run_profiles_json.py
      - name: Validate and stage candidate (candidate branches only)
        if: startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request'
        env:
          CANDIDATE_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          source = Path('PlatformIO/src/main.cpp').read_text()
          version = re.search(r'// LayerGlow v(\d+\.\d+)', source).group(1)
          if os.environ['CANDIDATE_BRANCH'] != f'candidate/v{version}':
              raise SystemExit('Candidate branch and source version differ')
          image = Path('PlatformIO/.pio/build/esp32c3/firmware.bin').read_bytes()
          if not 100_000 < len(image) <= 1_900_000 or image[0] != 0xe9:
              raise SystemExit(f'Unexpected ESP32 image: {len(image)} bytes')
          name = 'LayerGlow_v' + version.replace('.', '_') + '_OTA.bin'
          folder = Path('Software'); folder.mkdir(exist_ok=True)
          (folder / name).write_bytes(image)
          manifest = {'version': version, 'file': name, 'size': len(image), 'sha256': hashlib.sha256(image).hexdigest()}
          (folder / 'update.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('OTA_FILE=' + name + '\n')
          print(json.dumps(manifest))
          PY
      - name: Keep compiled candidate on its own branch
        if: startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request'
        env:
          CANDIDATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Software/$OTA_FILE" Software/update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: stage $OTA_FILE"
          git push origin "HEAD:$CANDIDATE_BRANCH"
