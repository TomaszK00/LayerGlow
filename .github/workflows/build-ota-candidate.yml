name: Firmware checks and OTA candidate

on:
  push:
    branches: [main, 'candidate/**']
    paths: ['PlatformIO/**', 'Arduino/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['PlatformIO/**', 'Arduino/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32c3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Firmware regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser regression tests
        run: |
          npm ci --ignore-scripts --prefix tests
          npm test --prefix tests
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Compile ESP32-C3
        run: pio run -d PlatformIO -e esp32c3
      - name: Printer profile persistence tests
        run: python tests/run_profiles_json.py
      - name: Validate and stage candidate (candidate branches only)
        if: startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request'
        env:
          CANDIDATE_BRANCH: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.LAYERGLOW_OTA_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tempfile
          from pathlib import Path
          source = Path('PlatformIO/src/main.cpp').read_text()
          version = re.search(r'// LayerGlow v(\d+\.\d+)', source).group(1)
          if os.environ['CANDIDATE_BRANCH'] != f'candidate/v{version}':
              raise SystemExit('Candidate branch and source version differ')
          if not os.environ.get('SIGNING_KEY'):
              print('No signing secret: compile and tests completed; candidate OTA is not staged.')
          else:
              with tempfile.TemporaryDirectory() as folder:
                  key = Path(folder) / 'private.pem'
                  key.write_text(os.environ['SIGNING_KEY'])
                  key.chmod(0o600)
                  subprocess.run(['python', 'security/sign_ota.py',
                                  '--image', 'PlatformIO/.pio/build/esp32c3/firmware.bin',
                                  '--key', str(key), '--version', version], check=True)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('OTA_FILE=LayerGlow_v' + version.replace('.', '_') + '_OTA.bin\n')
          PY
      - name: Keep compiled candidate on its own branch
        if: startsWith(github.ref, 'refs/heads/candidate/') && github.event_name != 'pull_request'
        env:
          CANDIDATE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$OTA_FILE" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Software/$OTA_FILE" "Software/$OTA_FILE.sig" Software/update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: stage $OTA_FILE"
          git push origin "HEAD:$CANDIDATE_BRANCH"
